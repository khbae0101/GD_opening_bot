name: Weather Summary
 
on:
  # 실행은 cron-job.org가 매일 아침(월~토) 호출(dispatch)해서 시작됩니다.
  workflow_dispatch:
 
permissions:
  contents: write          # 포춘쿠키 선정 이력(CSV) 저장에 필요
 
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests anthropic
 
      - name: Run weather
        env:
          TELEGRAM_TOKEN_3:  ${{ secrets.TELEGRAM_TOKEN_3 }}
          TARGET_CHAT_ID_3:  ${{ secrets.TARGET_CHAT_ID_3 }}
          KMA_SERVICE_KEY:   ${{ secrets.KMA_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weather_oneshot.py
 
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pick_log.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "포춘쿠키 선정 이력 업데이트"
            git push
          fi
 
