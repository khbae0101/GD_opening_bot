name: Interim Check

on:
  # 실행은 cron-job.org가 14시 / 16시 / 18시에 호출(dispatch)해서 시작됩니다.
  workflow_dispatch:

permissions:
  contents: write          # 원본(raw) 저장에 필요

jobs:
  interim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run interim
        env:
          TELEGRAM_TOKEN_3: ${{ secrets.TELEGRAM_TOKEN_3 }}
          TARGET_CHAT_ID_3: ${{ secrets.TARGET_CHAT_ID_3 }}
        run: python interim_oneshot.py

      # 스크립트가 실패해도 읽어온 원본은 반드시 저장한다
      - name: Commit raw data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/raw 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "실적 원본 수집"
            git push
          fi
